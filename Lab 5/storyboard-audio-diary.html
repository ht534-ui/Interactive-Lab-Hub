<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yesterday Together: Audio Diary</title>
  <style>
    :root { --paper:#f7f3ea; --ink:#292b2d; --muted:#74797b; --line:#c8c7c1; }
    * { box-sizing:border-box; }
    body { margin:0; background:#deddd8; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    .tools { max-width:1280px; margin:auto; padding:14px 48px; display:flex; justify-content:flex-end; }
    .tools a { color:#616769; font-size:12px; text-underline-offset:3px; }
    .tools a:focus-visible { outline:2px solid #367e78; outline-offset:4px; }
    .page { width:1280px; max-width:100%; margin:auto; padding:46px 48px 50px; background:var(--paper); }
    h1 { margin:0 0 35px; font:700 32px/1 Georgia,"Times New Roman",serif; letter-spacing:-.025em; }
    .route + .route { margin-top:50px; }
    h2 { display:flex; align-items:center; gap:14px; margin:0 0 18px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    h2::after { content:""; flex:1; height:1px; background:var(--line); }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:29px 18px; }
    figure { margin:0; min-width:0; }
    .frame { position:relative; width:100%; aspect-ratio:4/3; background:var(--paper); border:1px solid var(--line); overflow:hidden; }
    img { width:100%; height:100%; display:block; object-fit:contain; }
    .number { position:absolute; top:10px; left:10px; width:28px; height:28px; display:grid; place-items:center; border-radius:50%; background:#73797c; color:#faf8f2; font-size:10px; font-weight:700; }
    figcaption { padding-top:8px; }
    figcaption strong { display:block; font:700 18px/1.15 Georgia,"Times New Roman",serif; }
    figcaption span { display:block; margin-top:4px; color:var(--muted); font-size:10px; line-height:1.4; letter-spacing:.06em; text-transform:uppercase; }
    .done figcaption strong { color:#ad5e3c; }
    .rhythm { display:flex; justify-content:space-between; align-items:center; gap:40px; border-top:1px solid var(--line); margin-top:38px; padding-top:20px; }
    .rhythm p { margin:0; display:flex; gap:28px; color:var(--muted); font-size:10px; letter-spacing:.06em; text-transform:uppercase; line-height:1.6; }
    .rhythm p span { display:block; }
    .rhythm b { display:block; font-weight:700; }
    .wave { display:flex; align-items:center; gap:18px; color:var(--muted); }
    .wave-label { font:italic 13px Georgia,"Times New Roman",serif; white-space:nowrap; }
    .wave svg { width:260px; height:60px; overflow:visible; }
    .wave path,.wave line { stroke:#8b908f; stroke-width:1.2; fill:none; }
    .wave text { fill:var(--muted); font:9px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:.02em; }
    @media (max-width:760px) { .page { padding:28px 20px; } .tools { padding:14px 20px; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .rhythm { flex-direction:column; align-items:flex-start; gap:20px; } }
    @media (max-width:460px) { .grid { grid-template-columns:1fr; } h2 { font-size:10px; letter-spacing:.1em; } .wave { flex-direction:column; align-items:flex-start; gap:8px; } .rhythm p { gap:20px; } }
    @media print { .tools { display:none; } body { background:var(--paper); } figure { break-inside:avoid; } }

    /* Adapted from the Hub storyboard template; screen copy is HTML, not generated lettering. */
    h1 { margin-bottom:27px; }
    .frame { container-type:inline-size; }
    figcaption { padding-top:12px; }
    figcaption .caption { margin-top:7px; max-width:36em; color:#5c6263; font-size:13px; line-height:1.5; letter-spacing:0; text-transform:none; }
    figcaption .controls { margin-top:9px; color:#5c6263; font-size:11px; line-height:1.4; letter-spacing:.015em; text-transform:none; }
    .screen-status { position:absolute; display:flex; justify-content:center; align-items:center; color:#414747; text-align:center; font-weight:500; line-height:1.45; }
    .handoff { left:55.4%; top:48.7%; width:28.8%; height:20.5%; transform:rotate(6deg) skewX(-9deg); font-size:2.85cqw; }
    .processing { left:43.2%; top:53.5%; width:28%; height:17%; transform:rotate(5deg) skewX(-8deg); font-size:3.4cqw; }
  </style>
</head>
<body>
  <nav class="tools" aria-label="Download"><a href="storyboard-audio-diary-render.png" download>Download PNG</a></nav>
  <main class="page" id="storyboard">
    <h1>Yesterday Together: Audio Diary</h1>
    <section class="route" aria-labelledby="concept-stage">
      <h2 id="concept-stage">Initial concept · Intended interaction</h2>
      <div class="grid">
        <figure>
          <div class="frame">
            <img src="assets/storyboard-audio-diary/01-bedtime-handoff.png" alt="At bedtime, an older adult and caregiver sit beside each other, facing a generic Pi display. The older adult presses the single large button; a small speaker stands alongside.">
            <span class="number">01</span>
            <span class="screen-status handoff">Your diary will be<br>prepared overnight.</span>
          </div>
          <figcaption>
            <strong>Bedtime handoff</strong>
            <span class="caption">Choose photos and clips together, remove unwanted items and add notes. Then press “Prepare My Diary.”</span>
          </figcaption>
        </figure>
        <figure>
          <div class="frame">
            <img src="assets/storyboard-audio-diary/02-overnight-processing.png" alt="The older adult rests in a background room while the generic Pi device works alone on selected daytime records. Its screen faces away from the bed. No camera or person operating the device is present.">
            <span class="number">02</span>
            <span class="screen-status processing">Processing</span>
          </div>
          <figcaption>
            <strong>Overnight processing</strong>
            <span class="caption">Selected daytime records become a draft while the user rests. No interaction needed.</span>
          </figcaption>
        </figure>
        <figure>
          <div class="frame">
            <img src="assets/storyboard-audio-diary/03-morning-reveal.png" alt="In the intended morning flow, after caregiver review, the older adult presses the single large button to start approved narration. The screen shows a matching breakfast photograph and the caregiver sits alongside.">
            <span class="number">03</span>
          </div>
          <figcaption>
            <strong>Morning reveal</strong>
            <span class="caption">Caregiver review first; then the user presses Play. Approved narration accompanies the matching photo.</span>
            <span class="controls">Pause · Replay Chapter · Next Chapter</span>
          </figcaption>
        </figure>
      </div>
    </section>

  </main>
</body>
</html>
