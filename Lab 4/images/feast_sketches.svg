<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" width="1240" height="920" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M5 1 V9" stroke="#777" stroke-width="1.5"/>
    </marker>
    <!-- panel frame + hidden-electronics base shared by every sketch -->
    <g id="frame">
      <rect width="390" height="400" rx="10" fill="#fdfdfb" stroke="#333" stroke-width="2"/>
      <rect x="20" y="300" width="350" height="30" fill="#f3f4f6" stroke="#999" stroke-dasharray="5 4"/>
      <text x="30" y="320" font-size="10" fill="#666">base hides the Pi, Servo pHAT and sensor board</text>
      <line x1="20" y1="300" x2="370" y2="300" stroke="#333" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1240" height="920" fill="#ffffff"/>
  <text x="20" y="36" font-size="24" font-weight="bold" fill="#222">Feast Automata: five sketches</text>
  <g font-size="12" fill="#333">
    <rect x="420" y="22" width="22" height="13" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="448" y="33">sensor</text>
    <rect x="510" y="22" width="22" height="13" rx="3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/><text x="538" y="33">servo</text>
    <line x1="596" y1="29" x2="632" y2="29" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr)"/><text x="640" y="33">what moves</text>
    <line x1="730" y1="29" x2="766" y2="29" stroke="#777" stroke-width="2" stroke-dasharray="5 4"/><text x="774" y="33">resting position</text>
  </g>

  <!-- ============ 1. Over-pour head shaker ============ -->
  <g transform="translate(20,60)">
    <use href="#frame"/>
    <circle cx="24" cy="24" r="13" fill="#222"/><text x="24" y="29" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
    <text x="46" y="30" font-size="16" font-weight="bold" fill="#222">Over-pour head shaker</text>
    <!-- bottle pouring -->
    <g transform="translate(52,88) rotate(35)" fill="#fff" stroke="#333" stroke-width="2">
      <rect x="0" y="0" width="62" height="26" rx="5"/><rect x="62" y="8" width="18" height="10"/>
    </g>
    <path d="M113 146 Q118 170 118 212" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
    <!-- glass with liquid -->
    <polygon points="86.4,205 148.6,205 140,300 95,300" fill="#bfdbfe"/>
    <polygon points="85,190 150,190 140,300 95,300" fill="none" stroke="#333" stroke-width="2"/>
    <!-- copper strips + wire to base -->
    <g fill="#f59e0b" stroke="#b45309" stroke-width="1">
      <rect x="150" y="198" width="7" height="13"/><rect x="148" y="236" width="7" height="13"/><rect x="145" y="272" width="7" height="13"/>
    </g>
    <path d="M157 204 H172 V300" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="328" y="309" width="34" height="12" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="162" y="184" font-size="11" fill="#333">copper tape strips</text>
    <text x="178" y="222" font-size="11" fill="#333">top strip</text>
    <text x="178" y="235" font-size="11" fill="#333">= too full</text>
    <text x="286" y="319" font-size="10" fill="#2563eb">MPR121</text>
    <!-- figure -->
    <rect x="250" y="215" width="60" height="85" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="265" y="197" width="30" height="18" rx="3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
    <circle cx="280" cy="165" r="30" fill="#fff" stroke="#333" stroke-width="2"/>
    <circle cx="270" cy="160" r="3" fill="#333"/><circle cx="290" cy="160" r="3" fill="#333"/>
    <path d="M268 180 Q280 171 292 180" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <path d="M244 124 Q280 100 316 124" fill="none" stroke="#dc2626" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="280" y="96" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">shakes head</text>
    <line x1="318" y1="206" x2="296" y2="206" stroke="#999"/><text x="321" y="210" font-size="11" fill="#333">neck servo</text>
    <text x="16" y="354" font-size="11" fill="#333"><tspan font-weight="bold">Sensing:</tspan> copper tape on the glass reads the liquid level.</text>
    <text x="16" y="374" font-size="11" fill="#333"><tspan font-weight="bold">Movement:</tspan> at the top strip, the neck servo shakes the head.</text>
  </g>

  <!-- ============ 2. Sugar cube dropper ============ -->
  <g transform="translate(425,60)">
    <use href="#frame"/>
    <circle cx="24" cy="24" r="13" fill="#222"/><text x="24" y="29" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
    <text x="46" y="30" font-size="16" font-weight="bold" fill="#222">Sugar cube dropper</text>
    <!-- coaster + sensor + cup sitting on it -->
    <rect x="50" y="290" width="90" height="10" fill="#e5e7eb" stroke="#333" stroke-width="2"/>
    <rect x="84" y="285" width="22" height="9" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <polygon points="64.7,240 125.3,240 120,288 70,288" fill="#e7c9a9"/>
    <polygon points="62,215 128,215 120,288 70,288" fill="none" stroke="#333" stroke-width="2"/>
    <text x="20" y="200" font-size="11" fill="#333">cup detected</text>
    <line x1="146" y1="290" x2="107" y2="290" stroke="#999"/><text x="150" y="294" font-size="11" fill="#333">distance sensor</text>
    <!-- tall post: lifts the hopper so its gate is above the cup rim -->
    <rect x="278" y="152" width="18" height="148" fill="#f3f4f6" stroke="#333" stroke-width="2"/>
    <path d="M270 56 V150 M304 56 V132" fill="none" stroke="#333" stroke-width="2"/>
    <g fill="#fff" stroke="#333" stroke-width="1.5">
      <rect x="277" y="126" width="20" height="20"/><rect x="277" y="104" width="20" height="20"/><rect x="277" y="82" width="20" height="20"/><rect x="277" y="60" width="20" height="20"/>
    </g>
    <text x="312" y="84" font-size="11" fill="#333">hopper of</text>
    <text x="312" y="97" font-size="11" fill="#333">sugar cubes</text>
    <!-- servo gate at the bottom of the hopper -->
    <rect x="304" y="132" width="28" height="18" rx="3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
    <line x1="306" y1="148" x2="270" y2="150" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
    <text x="338" y="138" font-size="11" fill="#333">servo</text>
    <text x="338" y="151" font-size="11" fill="#333">gate</text>
    <!-- chute sloping DOWN from the gate to just above the cup rim -->
    <line x1="270" y1="152" x2="122" y2="206" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <rect x="190" y="160" width="18" height="18" fill="#fff" stroke="#333" stroke-width="1.5" transform="rotate(-20 199 169)"/>
    <path d="M256 132 Q190 146 136 182" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="150" y="104" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">one cube slides</text>
    <text x="150" y="118" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">down into the cup</text>
    <!-- height difference between gate and cup rim -->
    <line x1="128" y1="215" x2="262" y2="215" stroke="#777" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="252" y1="158" x2="252" y2="213" stroke="#777" stroke-width="1" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <text x="150" y="240" font-size="11" fill="#555">gate sits higher than the</text>
    <text x="150" y="253" font-size="11" fill="#555">cup rim, so the cube slides in</text>
    <text x="16" y="354" font-size="11" fill="#333"><tspan font-weight="bold">Sensing:</tspan> distance sensor in the coaster detects the cup.</text>
    <text x="16" y="374" font-size="11" fill="#333"><tspan font-weight="bold">Movement:</tspan> a servo gate lets one sugar cube slide down a chute.</text>
  </g>

  <!-- ============ 3. Cheers buddy ============ -->
  <g transform="translate(830,60)">
    <use href="#frame"/>
    <circle cx="24" cy="24" r="13" fill="#222"/><text x="24" y="29" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
    <text x="46" y="30" font-size="16" font-weight="bold" fill="#222">Cheers buddy</text>
    <rect x="50" y="290" width="90" height="10" fill="#e5e7eb" stroke="#333" stroke-width="2"/>
    <rect x="84" y="285" width="22" height="9" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <polygon points="65,140 125,140 118,210 72,210" fill="#fff" stroke="#333" stroke-width="2"/>
    <polygon points="67.5,165 122.5,165 118,210 72,210" fill="#bfdbfe"/>
    <polygon points="65,140 125,140 118,210 72,210" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="146" y1="268" x2="146" y2="196" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="30" y="236" font-size="11" fill="#dc2626">cup lifted</text>
    <line x1="60" y1="270" x2="84" y2="288" stroke="#999"/><text x="20" y="266" font-size="11" fill="#333">distance sensor</text>
    <!-- buddy -->
    <rect x="258" y="200" width="60" height="100" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
    <circle cx="288" cy="170" r="26" fill="#fff" stroke="#333" stroke-width="2"/>
    <circle cx="279" cy="165" r="3" fill="#333"/><circle cx="297" cy="165" r="3" fill="#333"/>
    <path d="M277 177 Q288 187 299 177" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <rect x="246" y="208" width="22" height="16" rx="3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
    <!-- resting arm, raised arm, tiny glass -->
    <line x1="252" y1="218" x2="222" y2="268" stroke="#777" stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round"/>
    <line x1="252" y1="216" x2="212" y2="164" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <polygon points="198,138 222,138 218,162 202,162" fill="#bfdbfe" stroke="#333" stroke-width="2"/>
    <path d="M206 262 Q178 218 194 172" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="150" y="122" font-size="12" fill="#dc2626" font-weight="bold">raises its glass</text>
    <line x1="232" y1="284" x2="250" y2="226" stroke="#999"/><text x="158" y="290" font-size="11" fill="#333">shoulder servo</text>
    <text x="16" y="354" font-size="11" fill="#333"><tspan font-weight="bold">Sensing:</tspan> distance sensor in the coaster sees the cup lift off.</text>
    <text x="16" y="374" font-size="11" fill="#333"><tspan font-weight="bold">Movement:</tspan> a shoulder servo raises the buddy's arm and glass.</text>
  </g>

  <!-- ============ 4. Snack guard ============ -->
  <g transform="translate(222,480)">
    <use href="#frame"/>
    <circle cx="24" cy="24" r="13" fill="#222"/><text x="24" y="29" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
    <text x="46" y="30" font-size="16" font-weight="bold" fill="#222">Snack guard</text>
    <!-- bowl + snacks -->
    <path d="M90 240 A70 58 0 0 0 230 240 Z" fill="#fff" stroke="#333" stroke-width="2"/>
    <g fill="#fbbf24" stroke="#b45309" stroke-width="1">
      <circle cx="120" cy="236" r="7"/><circle cx="140" cy="232" r="7"/><circle cx="160" cy="235" r="7"/><circle cx="180" cy="232" r="7"/><circle cx="200" cy="236" r="7"/>
    </g>
    <rect x="76" y="230" width="18" height="11" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="52" y1="262" x2="80" y2="242" stroke="#999"/>
    <text x="20" y="274" font-size="11" fill="#333">APDS-9960</text>
    <text x="20" y="287" font-size="11" fill="#333">at the rim</text>
    <!-- reaching hand -->
    <g transform="translate(26,150) rotate(32)">
      <rect x="0" y="0" width="92" height="22" rx="11" fill="#ffd9b3" stroke="#333" stroke-width="2"/>
      <path d="M74 4 h16 M76 11 h18 M74 18 h16" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="20" y="136" font-size="12" fill="#333">reach 1 · 2 · 3</text>
    <!-- servo post + arm -->
    <rect x="290" y="180" width="24" height="120" fill="#f3f4f6" stroke="#333" stroke-width="2"/>
    <rect x="286" y="160" width="32" height="20" rx="3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
    <line x1="302" y1="168" x2="302" y2="72" stroke="#777" stroke-width="3" stroke-dasharray="5 4"/>
    <rect x="276" y="46" width="52" height="26" rx="6" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="302" y1="170" x2="196" y2="194" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <rect x="140" y="180" width="58" height="28" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="169" y="199" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">STOP</text>
    <path d="M270 70 Q205 92 184 170" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="112" y="84" font-size="12" fill="#dc2626" font-weight="bold">arm swings down</text>
    <text x="324" y="174" font-size="11" fill="#333">servo</text>
    <text x="16" y="354" font-size="11" fill="#333"><tspan font-weight="bold">Sensing:</tspan> APDS-9960 at the bowl's rim counts each reach.</text>
    <text x="16" y="374" font-size="11" fill="#333"><tspan font-weight="bold">Movement:</tspan> after the third reach, a servo arm blocks the bowl.</text>
  </g>

  <!-- ============ 5. Condiment passer cart ============ -->
  <g transform="translate(627,480)">
    <use href="#frame"/>
    <circle cx="24" cy="24" r="13" fill="#222"/><text x="24" y="29" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
    <text x="46" y="30" font-size="16" font-weight="bold" fill="#222">Condiment passer cart</text>
    <!-- joystick -->
    <rect x="30" y="270" width="50" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="55" y1="270" x2="62" y2="244" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <circle cx="63" cy="240" r="8" fill="#333"/>
    <text x="20" y="196" font-size="11" fill="#333">joystick:</text>
    <text x="20" y="210" font-size="11" fill="#333">← → move cart</text>
    <text x="20" y="224" font-size="11" fill="#333">↑ ↓ pick condiment</text>
    <!-- track -->
    <rect x="105" y="294" width="258" height="6" fill="#d1d5db" stroke="#333" stroke-width="1"/>
    <!-- cart, wheels, turntable, bottles -->
    <rect x="190" y="256" width="90" height="26" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
    <circle cx="208" cy="287" r="7" fill="#fff" stroke="#333" stroke-width="2"/><circle cx="262" cy="287" r="7" fill="#fff" stroke="#333" stroke-width="2"/>
    <ellipse cx="235" cy="254" rx="40" ry="6" fill="#e5e7eb" stroke="#333" stroke-width="2"/>
    <g stroke="#333" stroke-width="1.5">
      <rect x="210" y="216" width="14" height="36" rx="3" fill="#f87171"/><rect x="213" y="209" width="8" height="7" fill="#fff"/>
      <rect x="228" y="210" width="14" height="42" rx="3" fill="#fde047"/><rect x="231" y="203" width="8" height="7" fill="#fff"/>
      <rect x="246" y="224" width="14" height="28" rx="3" fill="#fff"/><rect x="246" y="219" width="14" height="5" fill="#d1d5db"/>
    </g>
    <rect x="223" y="261" width="24" height="16" rx="3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
    <line x1="166" y1="266" x2="222" y2="269" stroke="#999"/>
    <text x="118" y="262" font-size="11" fill="#333">servo 2</text>
    <text x="118" y="275" font-size="11" fill="#333">(turns)</text>
    <text x="235" y="192" font-size="11" fill="#333" text-anchor="middle">condiments on a turntable</text>
    <!-- drive servo with spool + string -->
    <rect x="334" y="262" width="30" height="22" rx="3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
    <circle cx="340" cy="273" r="8" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
    <line x1="332" y1="273" x2="280" y2="273" stroke="#333" stroke-width="1.5"/>
    <line x1="340" y1="240" x2="347" y2="261" stroke="#999"/>
    <text x="300" y="222" font-size="11" fill="#333">servo 1</text>
    <text x="300" y="235" font-size="11" fill="#333">(pulls cart)</text>
    <line x1="170" y1="150" x2="310" y2="150" stroke="#dc2626" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="240" y="140" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">moves along the table</text>
    <text x="16" y="354" font-size="11" fill="#333"><tspan font-weight="bold">Sensing:</tspan> the joystick picks a condiment and steers the cart.</text>
    <text x="16" y="374" font-size="11" fill="#333"><tspan font-weight="bold">Movement:</tspan> one servo pulls the cart; another turns the rack.</text>
  </g>
</svg>
